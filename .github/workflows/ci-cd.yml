name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # TODO: remover continue-on-error quando a dívida técnica de lint/testes for resolvida
      - run: npm run lint
        continue-on-error: true

      - run: npm run build

      - run: npm test
        continue-on-error: true

  deploy:
    name: Deploy to Firebase Functions
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Write .env from secrets
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          cat <<EOF > .env.my-store-prd
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EOF
          # Rota interna do cardápio digital (/internal/*): mesmo valor do my-store-cardapio-web-back-api.
          # Sem ele (ou com menos de 32 caracteres) a rota interna fica fechada (401); o resto da API funciona.
          if [ "${#INTERNAL_API_SECRET}" -lt 32 ]; then
            echo "::warning::INTERNAL_API_SECRET ausente ou curto: pedidos e 'ao vivo' do cardápio não vão funcionar em produção"
          else
            echo "INTERNAL_API_SECRET=$INTERNAL_API_SECRET" >> .env.my-store-prd
          fi

      - run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy functions
        run: npx firebase-tools deploy --only functions --project my-store-prd --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
